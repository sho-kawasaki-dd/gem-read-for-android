name: Android CI/CD

permissions:
    contents: write

on:
    push:
        branches: ["main"]
        tags: ["v*"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Run Lint
              run: ./gradlew lintDebug

            - name: Run Unit Tests
              run: ./gradlew testDebugUnitTest

            - name: Compile Android Tests
              run: ./gradlew :app:compileDebugAndroidTestKotlin

            - name: Build Debug APK
              run: ./gradlew assembleDebug

            - name: Upload Debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: debug-apk
                  path: app/build/outputs/apk/debug/app-debug.apk

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Decode Keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              run: |
                  echo $KEYSTORE_BASE64 | base64 -d > ${{ runner.temp }}/release.keystore

            - name: Build and Sign Release
              env:
                  KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: ./gradlew assembleRelease bundleRelease --no-daemon

            - name: Upload Release APK
              uses: actions/upload-artifact@v4
              with:
                  name: release-apk
                  path: app/build/outputs/apk/release/app-release.apk

            - name: Upload Release AAB
              uses: actions/upload-artifact@v4
              with:
                  name: release-aab
                  path: app/build/outputs/bundle/release/app-release.aab

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      app/build/outputs/apk/release/app-release.apk
                      app/build/outputs/bundle/release/app-release.aab
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Cleanup Keystore
              if: always()
              run: rm -f ${{ runner.temp }}/release.keystore
